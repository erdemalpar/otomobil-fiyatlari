name: Otomobil Fiyatlari Scraper Bot

on:
  schedule:
    - cron: '0 3 * * *' # Her gece saat 03:00'te otomatik çalışır
  workflow_dispatch: # Arayüzden manuel tetikleme imkanı

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repoya push yapabilmesi için yazma izni
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Run Scraper
      run: python scripts/scraper.py
      
    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add public/data/vehicles.json
        # Değişiklik varsa commit et ve pushla
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Güncel araç fiyatları veritabanı [skip ci]" && git push)
